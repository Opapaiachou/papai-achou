name: Rodadas automáticas do robô

# 6 rodadas por dia (horário de Brasília): 7h, 10h, 13h, 16h, 19h e 22h.
# Magalu e Awin entram sozinhos; a Shopee entra quando as chaves da Open API existirem.
on:
  schedule:
    - cron: "7 10,13,16,19,22,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-papai-achou
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Buscar ofertas e mandar para aprovação
        run: python -m robo.main

      - name: Salvar histórico de preços e vitrine
        run: |
          git config user.name "robo-papai-achou"
          git config user.email "robo@users.noreply.github.com"
          git add -A dados docs/ofertas.json
          git diff --cached --quiet && exit 0
          git commit -m "Rodada automática do robô"
          git pull --rebase
          git push
