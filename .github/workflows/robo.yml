name: Robô Papai Achou

on:
  # Rodadas automáticas: ficam desligadas até as chaves da Shopee estarem nos segredos.
  # Para ligar, apague o "#" das duas linhas abaixo.
  # schedule:
  #   - cron: "0 10,13,16,19,22,1 * * *"   # 7h, 10h, 13h, 16h, 19h e 22h de Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = exemplos no seu Telegram · chat-id = descobre o seu chat_id · real = busca na Shopee"
        type: choice
        options: [teste, chat-id, real]
        default: teste

permissions:
  contents: write         # para salvar o histórico de preços e a vitrine no repositório

concurrency:
  group: robo-papai-achou
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODO: ${{ github.event.inputs.modo || 'real' }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Descobrir o chat_id
        if: env.MODO == 'chat-id'
        run: python -m robo.main --chat-id

      - name: Teste com produtos de exemplo
        if: env.MODO == 'teste'
        run: python -m robo.main --teste

      - name: Buscar ofertas e mandar para aprovação
        if: env.MODO == 'real'
        run: python -m robo.main

      - name: Salvar histórico de preços e vitrine
        if: env.MODO == 'real'
        run: |
          git config user.name "robo-papai-achou"
          git config user.email "robo@users.noreply.github.com"
          git add dados/historico.json docs/ofertas.json
          git diff --cached --quiet || git commit -m "Rodada do robô: histórico e vitrine"
          git push
